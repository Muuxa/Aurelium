pluginManagement {
    repositories {
        gradlePluginPortal()
        // Fallback source for the ModDevGradle plugin, so a stale plugin-portal cache can't
        // leave the plugin (and therefore NeoForge) unresolved.
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'aurelium'