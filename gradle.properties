org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
minecraft_version=1.21.1
neo_version=21.1.248
mod_id=aurelium
mod_group_id=com.muuxa.aurelium
mod_version=0.8.25
# IMPORTANT: Gradle reads gradle.properties as ISO-8859-1 (Latin-1), so any non-ASCII
# here is corrupted before it ever reaches the mod metadata. Keep this ASCII-only; the
# localised display name lives as a UTF-8 literal in src/main/templates/META-INF/neoforge.mods.toml.
mod_name=Aurelium
mod_license=MIT
# compile-only dependencies bundled in libs/ for portable offline source import.
ae2_version=19.2.17
kubejs_version=2101.7.2-build.368
# NeoEcoAE is optional at runtime: only used to learn its exact-BigInteger transport
# contract. It is compileOnly so AURELIUM keeps working without it.
neoecoae_version=21.2.0-beta6-hotfix1
# Data_Energistics is also optional/compileOnly: its exact-accounting read interface
# is bridged, its own write path stays long.
data_energistics_version=1.21.1-3.3.1



